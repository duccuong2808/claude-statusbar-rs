[package]
name = "claude-statusbar-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Fast single-binary Claude Code status line (aurora/graphite look of claude-statusbar)"

[lib]
name = "csr"
path = "src/lib.rs"

[[bin]]
name = "csr"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
ref_option = "warn"
manual_is_variant_and = "warn"
map_unwrap_or = "warn"
format_push_string = "warn"
redundant_closure_for_method_calls = "warn"
